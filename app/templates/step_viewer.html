<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Урок | Musa Code Academy</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/step-renderer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/step-viewer.css') }}">
    <script
        type="module"
        src="{{ url_for('static', path='js/step-viewer.js') }}"
    ></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app-header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/student.css') }}">
    <link rel="icon" href="{{ url_for('static', path='images/academy-mark.svg') }}" type="image/svg+xml">
    <meta name="theme-color" content="#f7f8f2">
    <script type="module" src="{{ url_for('static', path='js/app-header.js') }}"></script>
</head>
<body class="student-app student-app--lesson">
    {% include "components/app_header.html" %}
    <button
        class="step-drawer-toggle"
        type="button"
        aria-label="Открыть навигацию по шагам"
        aria-controls="step-navigation-drawer"
        aria-expanded="false"
        data-step-drawer-toggle
    >
        <span aria-hidden="true">☰</span><span>Шаги урока</span>
    </button>

    <div class="step-drawer-backdrop" data-step-drawer-backdrop></div>

    <aside
        class="step-drawer"
        id="step-navigation-drawer"
        aria-hidden="true"
        inert
        aria-labelledby="step-drawer-title"
        data-step-drawer
    >
        <button class="step-drawer__close" type="button" aria-label="Закрыть навигацию по шагам" data-step-drawer-close>
            <svg class="step-drawer__close-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="m15 6-6 6 6 6" />
            </svg>
            <svg class="step-drawer__close-cross" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
                <path d="m6 6 12 12M18 6 6 18" />
            </svg>
        </button>
        <header class="step-drawer__header">
            <p class="step-drawer__eyebrow">Урок</p>
            <h2
                class="step-drawer__title"
                id="step-drawer-title"
                data-step-drawer-title
            >Загрузка…</h2>
        </header>

        <div class="lesson-progress"><p data-lesson-progress-label>Загружаем прогресс…</p><div role="progressbar" aria-label="Прогресс урока" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-lesson-progress><span data-lesson-progress-bar></span></div></div>
        <nav aria-label="Шаги урока">
            <ol class="step-drawer__list" data-step-drawer-list></ol>
            <p class="step-drawer__message" data-step-drawer-message>
                Загружаем шаги…
            </p>
        </nav>
    </aside>

    <main id="app-main"
        class="step-viewer"
        data-step-viewer
        data-step-id="{{ step_id }}"
        data-course-slug="{{ course_slug }}"
    >
        <header class="step-viewer__header">
            <nav class="lesson-breadcrumbs" aria-label="Путь обучения"><a data-step-course-link href="/dashboard">Программа курса</a><span aria-hidden="true">/</span><span data-step-lesson-name>Урок</span></nav>
            <a
                class="step-viewer__back-link"
                role="link"
                aria-disabled="true"
                data-back-to-lesson
            ></a>
            <h1 class="step-viewer__title" data-step-title></h1>
            <p class="step-viewer__progress" data-step-progress></p>

        </header>

        <section
            class="step-viewer__content"
            data-step-content
            aria-live="polite"
            aria-busy="true"
        >
            <div class="step-viewer__placeholder" data-content-placeholder></div>
        </section>

        <section
            class="task-viewer"
            data-task-viewer
            aria-live="polite"
            hidden
        ></section>

        <div class="step-completion">
            <button
                class="step-viewer__complete-button"
                type="button"
                data-step-complete-toggle
                hidden
            ></button>
            <p class="step-progress-error" data-step-progress-error role="alert" hidden></p>
        </div>

        <nav class="step-viewer__navigation" data-step-navigation hidden>
            <button
                class="step-viewer__navigation-button"
                type="button"
                data-previous-step
                disabled
            ></button>
            <button
                class="step-viewer__navigation-button step-viewer__navigation-button--primary"
                type="button"
                data-next-step
                disabled
            ></button>
        </nav>
    </main>
    {% include "components/app_footer.html" %}
</body>
</html>
