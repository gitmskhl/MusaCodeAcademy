<!DOCTYPE html>
<html lang="ru" data-design-system="mca-v1" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include "components/student_head.html" %}
    <title>{{ title }} | Musa Code Academy</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app-header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/student.css') }}">
    <script type="module" src="{{ url_for('static', path='js/app-header.js') }}"></script>
    <script type="module" src="{{ url_for('static', path='js/student-inbox.js') }}"></script>
</head>
<body class="student-app" data-inbox="{{ view }}">
    {% include 'components/app_header.html' %}
    <main class="inbox-shell" id="app-main">
        <p class="notification-feedback" data-inbox-status role="status">Проверка доступа…</p>
        <div data-inbox-shell hidden>
            <div class="inbox-heading"><h1>{{ title }}</h1>{% if view == 'notifications' %}<button class="student-secondary-link" type="button" data-read-all disabled>Прочитать все</button>{% endif %}</div>
            <div class="inbox-list" data-inbox-list aria-live="polite"></div>
            <div data-inbox-pagination></div>
        </div>
    </main>
    {% include 'components/app_footer.html' %}
</body>
</html>
