<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курс | Musa Code Academy</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app-header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/course-unenroll.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/course.css') }}">
    <script type="module" src="{{ url_for('static', path='js/app-header.js') }}"></script>
    <script type="module" src="{{ url_for('static', path='js/course.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/student.css') }}">
    <link rel="icon" href="{{ url_for('static', path='images/academy-mark.svg') }}" type="image/svg+xml">
    <meta name="theme-color" content="#f7f8f2">
</head>
<body class="student-app">
    {% include "components/app_header.html" %}

    <main id="app-main"
        class="course-page"
        data-course-page
        data-course-slug="{{ course_slug | default('') }}"
    >
        <a class="course-back" href="/courses">
            <span aria-hidden="true">&larr;</span>
            Назад ко всем курсам
        </a>

        <section class="course-hero" aria-labelledby="course-title">
            <h1 id="course-title" data-course-title></h1>
            <p data-course-description></p>
            <div class="course-meta" aria-label="Краткая информация о курсе" data-course-meta></div>
        </section>

        <div class="course-layout">
            <div class="course-main">
                <section class="course-card course-outcomes" aria-labelledby="course-outcomes-title">
                    <h2 id="course-outcomes-title">Чему ты научишься</h2>
                    <div class="course-outcomes__grid" data-course-outcomes></div>
                </section>

                <section class="course-card course-program" aria-labelledby="course-program-title">
                    <h2 id="course-program-title">Программа курса</h2>
                    <div class="course-accordion" data-course-program></div>
                </section>
            </div>

            <aside class="course-sidebar" aria-label="Информация о курсе">
                <div class="course-info-card">
                    <div class="course-video" data-course-video hidden>
                        <div class="course-video__preview" data-course-video-preview aria-hidden="true" inert></div>
                        <button class="course-video__open" type="button" data-course-video-open aria-haspopup="dialog" aria-controls="course-video-dialog">
                            <span class="course-video__play" aria-hidden="true">▶</span>
                            <span>Смотреть видео о курсе</span>
                        </button>
                    </div>
                    <dl class="course-facts">
                        <div>
                            <dt>Занятий:</dt>
                            <dd data-course-lessons-count></dd>
                        </div>
                        <div>
                            <dt>Разделов:</dt>
                            <dd data-course-sections-count></dd>
                        </div>
                        <div>
                            <dt>Уровень:</dt>
                            <dd data-course-level></dd>
                        </div>
                        <div>
                            <dt>Стоимость:</dt>
                            <dd data-course-price></dd>
                        </div>
                    </dl>

                    <button class="course-enroll-button" type="button">Записаться на курс</button>
                    <button class="course-unenroll-button" type="button" data-course-unenroll hidden>Отписаться от курса</button>
                    <p class="course-note">
                        Запишись, чтобы открыть уроки, решать задачи и сохранять свой прогресс.
                    </p>
                </div>
            </aside>
        </div>
    </main>
    <dialog id="course-video-dialog" class="course-video-dialog" data-course-video-dialog aria-labelledby="course-video-title">
        <div class="course-video-dialog__header">
            <h2 id="course-video-title" data-course-video-title>Видео о курсе</h2>
            <button type="button" class="course-video-dialog__close" data-course-video-close aria-label="Закрыть видео" autofocus>×</button>
        </div>
        <div data-course-video-player></div>
    </dialog>
    {% include "components/app_footer.html" %}
</body>
</html>
